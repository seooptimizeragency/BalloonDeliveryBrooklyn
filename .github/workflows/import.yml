name: Import site package
on:
  push:
    paths:
      - '.github/workflows/import.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download import-1 --repo seooptimizeragency/BalloonDeliveryBrooklyn --pattern 'brooklyn.zip' --dir /tmp/pkg
      - name: Verify and unpack
        run: |
          echo "800daec9e6559b58299b1a565d006308fad225c1fc10f2e252f80cf5e5d2d8a5  /tmp/pkg/brooklyn.zip" | sha256sum -c -
          rm -rf /tmp/site && mkdir -p /tmp/site
          unzip -q /tmp/pkg/brooklyn.zip -d /tmp/site
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a /tmp/site/. .
          rm -rf .github
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import website package"
          git push
